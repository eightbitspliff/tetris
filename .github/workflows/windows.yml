name: Windows Installer

on:
  push:
    paths:
      - 'index.html'
      - 'js/**'
      - 'desktop/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Set version
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Optional code signing (see desktop/electron-builder.config.js); unset secrets are ignored
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
        run: npm run dist

      - name: Signature and checksum
        shell: pwsh
        run: |
          $exe = "release/NeonTetris-Setup-1.0.${{ github.run_number }}.exe"
          $sig = Get-AuthenticodeSignature $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($sig.Status -eq 'Valid') { $state = "signiert von $($sig.SignerCertificate.Subject)" } else { $state = 'nicht signiert' }
          Write-Host "Signatur: $state"
          "Signatur: $state`n`nSHA-256: ``$hash``" | Out-File -Encoding utf8 release-info.md

      - name: Check installer
        shell: bash
        run: |
          ls -la release
          test -f "release/NeonTetris-Setup-1.0.${{ github.run_number }}.exe"
          # asar prints Windows paths with backslashes, so match either separator
          npx --yes @electron/asar list release/win-unpacked/resources/app.asar > asar-files.txt
          grep -E 'game[\\/]index\.html' asar-files.txt
          grep -E 'game[\\/]js[\\/]main\.js' asar-files.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NeonTetris-Setup
          path: desktop/release/NeonTetris-Setup-*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-build-${{ github.run_number }}
          name: Neon Tetris – Windows (Build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: desktop/release/NeonTetris-Setup-*.exe
          body_path: desktop/release-info.md
