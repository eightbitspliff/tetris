name: Android APK

on:
  push:
    paths:
      - 'index.html'
      - 'js/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../NeonTetris.apk

      - name: Check APK contents
        run: |
          unzip -l NeonTetris.apk | grep -E 'assets/web/|classes.dex'
          for f in index.html js/game.js js/render.js js/input.js js/touch.js js/audio.js js/main.js; do
            unzip -l NeonTetris.apk | grep -q "assets/web/$f" || { echo "missing $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: NeonTetris-apk
          path: NeonTetris.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Neon Tetris – Android (Build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: NeonTetris.apk
          body: |
            Android-App von Neon Tetris.
            **NeonTetris.apk** auf dem Handy herunterladen und öffnen, um sie zu installieren.
