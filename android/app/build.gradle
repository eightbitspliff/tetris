plugins {
    id 'com.android.application'
}

// The game itself lives in the repository root (index.html + js/); copy it into the APK assets.
def webAssets = file('src/main/assets/web')
tasks.register('copyWebAssets', Copy) {
    from(rootProject.file('..')) {
        include 'index.html'
        include 'js/**'
    }
    into webAssets
}
preBuild.dependsOn 'copyWebAssets'

android {
    namespace 'com.eightbitspliff.neontetris'
    compileSdk 35

    defaultConfig {
        applicationId 'com.eightbitspliff.neontetris'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.0.${System.getenv('VERSION_CODE') ?: '1'}"
    }

    // Fixed key so that new versions install over old ones.
    signingConfigs {
        release {
            storeFile file('neontetris.keystore')
            storePassword 'neontetris'
            keyAlias 'neontetris'
            keyPassword 'neontetris'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
