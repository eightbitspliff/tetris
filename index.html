<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Neon Tetris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
    html, body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/touch.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
